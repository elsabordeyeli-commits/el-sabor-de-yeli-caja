<style>
:root{--bg:#fff7f1;--card:#fff;--tx:#231a15;--mu:#7a6a60;--or:#f2541b;--bd:#f3d9c8;--bad:#c0392b;--ok:#2e7d32;--btn:#f2541b;--btx:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17110e;--card:#241a15;--tx:#fbefe6;--mu:#b39d8f;--bd:#4a3226;--bad:#ff7b6b;--ok:#6fcf74}}
:root[data-theme="dark"]{--bg:#17110e;--card:#241a15;--tx:#fbefe6;--mu:#b39d8f;--bd:#4a3226;--bad:#ff7b6b;--ok:#6fcf74}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:2px solid var(--or);gap:8px;background:var(--card)}
header b{color:var(--or);font:italic 700 20px Georgia,serif}
nav{display:flex;gap:6px;padding:8px 10px;overflow-x:auto;border-bottom:1px solid var(--bd)}nav button{white-space:nowrap}
main{max-width:980px;margin:0 auto;padding:12px}
button,input,select{font:inherit;color:inherit}
button{background:var(--btn);color:var(--btx);border:0;border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:600}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}button.on{background:var(--tx);color:var(--bg)}button.d{background:var(--bad)}button:disabled{opacity:.4}
input,select{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:9px;width:100%}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:8px}
.p{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--card);color:var(--tx);border:1px solid var(--bd)}.p span{color:var(--or)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1;min-width:100px}
.sp{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--bd)}.sp:last-child{border:0}
.mu{color:var(--mu)}.tot{font-size:24px;font-weight:700;color:var(--or)}.two{display:grid;gap:12px;grid-template-columns:1fr}@media(min-width:760px){.two{grid-template-columns:2fr 1fr}}
.q{flex:0 0 auto!important;min-width:0!important;padding:4px 11px}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;position:relative;isolation:isolate;overflow:hidden}
.login::before,.rep::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--wm) center/contain no-repeat;pointer-events:none;-webkit-mask-image:radial-gradient(circle at center,#000 35%,transparent 72%);mask-image:radial-gradient(circle at center,#000 35%,transparent 72%)}
.login>div input{color:#231a15;background:#fff}.login::before{opacity:.5;filter:blur(2px)}.login>div{width:100%;max-width:320px;background:#fffc;color:#231a15;border-radius:16px;padding:18px;backdrop-filter:blur(4px)}
.login h1{font:italic 700 30px Georgia,serif;color:var(--or);text-align:center;margin:0 0 10px}
.rep{font-family:ui-monospace,Menlo,monospace;font-size:14px;position:relative;isolation:isolate;overflow:hidden}.rep::before{opacity:.13}
.mo{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}.mo .card{width:100%;max-width:380px;margin:0;max-height:90%;overflow:auto}
@media print{.np{display:none!important}body{background:#fff;color:#000}.card{border:0}.mo{position:static;background:none}}

const go=t=>{tab=t;rcpt=rep=null;render()};
/* ---- venta ---- */
const sub=()=>sum(cart.map(i=>i.price*i.qty)),itb=()=>tx.i?Math.round(sub()*18)/100:0,prp=()=>tx.p?Math.round(sub()*10)/100:0,total=()=>sub()+itb()+prp();
function add(id){const p=S.prods.find(x=>x.id===id),i=cart.find(x=>x.id===id);i?i.qty++:cart.push({id,name:p.name,price:p.price,qty:1});render()}
function chg(id,d){const i=cart.find(x=>x.id===id);i.qty+=d;if(i.qty<=0)cart=cart.filter(x=>x!==i);render()}
function saveTab(){mesa=$('#mesa').value.trim();if(!mesa||!cart.length)return alertM('Escribe la mesa o cliente y agrega productos.');
 if(curTab)S.tabs=S.tabs.filter(t=>t.id!==curTab);S.tabs.push({id:curTab||uid(),mesa,items:cart,t:Date.now()});save();cart=[];curTab=null;mesa='';go('cuentas')}
function openTab(id){const t=S.tabs.find(x=>x.id===id);cart=t.items.map(i=>({...i}));curTab=id;mesa=t.mesa;go('venta')}
function pay(){if(!S.cash.open)return alertM('Primero abre la caja.');if(!cart.length)return;
 const m=$('#met').value,rec=+($('#rec')?.value||0),tt=total(),cl=$('#mesa').value.trim();
 if(m==='Fiado'&&!cl)return alertM('Escribe el nombre del cliente para fiar.');
 const paid=m==='Fiado'?Math.min(rec,tt):tt,credit=tt-paid,s={id:uid(),t:Date.now(),cs:S.cash.t,mesa:cl,method:m,tipo:$('#tipo').value,items:cart,sub:sub(),itbis:itb(),prop:prp(),total:tt,paid,credit,acct:m==='Tarjeta'||m==='Transferencia'?'bank':'cash',rec:m==='Efectivo'&&rec>=tt?rec:tt,by:me.name};
 S.sales.push(s);if(credit>0)S.credits.push({id:uid(),client:cl,total:credit,paid:0,t:s.t,pays:[]});
 if(curTab)S.tabs=S.tabs.filter(t=>t.id!==curTab);save();rcpt=s;cart=[];curTab=null;mesa='';render()}
function receipt(s){return`<div class="card rep"><div style="text-align:center"><b style="font:italic 700 22px Georgia,serif;color:var(--or)">El sabor de Yeli</b><br><span class="mu">Hecho con amor, servido para ti<br>Pedidos: (809) 721-6431 · (829) 395-4941</span></div><hr>${s.mesa?`Cliente/mesa: ${esc(s.mesa)} · `:''}${s.tipo}<br>${hm(s.t)} · ${esc(s.by||'')}<hr>${s.items.map(i=>`<div class="sp"><span>${i.qty} × ${esc(i.name)}</span><span>${money(i.qty*i.price)}</span></div>`).join('')}<hr>${s.itbis||s.prop?`<div class="sp"><span>Subtotal</span><span>${money(s.sub)}</span></div>${s.itbis?`<div class="sp"><span>ITBIS 18%</span><span>${money(s.itbis)}</span></div>`:''}${s.prop?`<div class="sp"><span>Propina 10%</span><span>${money(s.prop)}</span></div>`:''}`:''}<div class="sp"><b>TOTAL</b><b>${money(s.total)}</b></div><div class="sp"><span>${s.method}</span><span>${s.method==='Efectivo'?'Recibido '+money(s.rec)+' · Cambio '+money(s.rec-s.total):s.credit?'Abono '+money(s.paid)+' · Debe '+money(s.credit):''}</span></div><p style="text-align:center">¡Gracias por apoyar lo nuestro!</p></div>`}
function vVenta(){const L=S.prods.filter(p=>cat==='Todas'||p.cat===cat),t=total(),mt=$('#met')?.value||'Efectivo';
 return`<div class="two"><div><div class="row" style="margin-bottom:8px">${['Todas',...cats()].map(c=>`<button class="${c===cat?'on':'g'}" onclick="cat='${esc(c)}';render()">${esc(c)}</button>`).join('')}</div><div class="grid">${L.map(p=>`<button class="p" onclick="add('${p.id}')">${esc(p.name)}<span>${money(p.price)}</span></button>`).join('')}</div></div>
 <div class="card"><b>Cuenta actual</b><input id="mesa" placeholder="Mesa o cliente" value="${esc(mesa)}" style="margin:8px 0">${cart.map(i=>`<div class="sp"><span>${esc(i.name)}<br><small class="mu">${money(i.price)}</small></span><span class="row"><button class="g q" onclick="chg('${i.id}',-1)">−</button><b class="q">${i.qty}</b><button class="g q" onclick="chg('${i.id}',1)">+</button></span></div>`).join('')||'<p class="mu">Toca un plato para agregarlo.</p>'}
 <div class="row" style="margin:6px 0"><label><input type="checkbox" style="width:auto" ${tx.i?'checked':''} onchange="tx.i=this.checked?1:0;render()"> ITBIS 18%</label><label><input type="checkbox" style="width:auto" ${tx.p?'checked':''} onchange="tx.p=this.checked?1:0;render()"> Propina 10%</label></div>
 <div class="sp"><span>Total</span><span class="tot">${money(t)}</span></div><div class="row" style="margin:6px 0"><select id="tipo"><option>Local</option><option>Llevar</option><option>Delivery</option></select><select id="met" onchange="render()">${['Efectivo','Tarjeta','Transferencia','Fiado'].map(m=>`<option ${m===mt?'selected':''}>${m}</option>`).join('')}</select></div>${mt==='Efectivo'||mt==='Fiado'?`<input id="rec" type="number" inputmode="decimal" placeholder="${mt==='Fiado'?'Abono recibido (opcional)':'Efectivo recibido (opcional)'}" style="margin-bottom:8px">`:''}
 <div class="row"><button class="g" onclick="saveTab()" ${cart.length?'':'disabled'}>Guardar cuenta</button><button onclick="pay()" ${cart.length?'':'disabled'}>Cobrar</button></div>${cart.length?`<button class="g" style="width:100%;margin-top:8px" onclick="cart=[];curTab=null;mesa='';render()">Vaciar</button>`:''}</div></div>`}
const vCuentas=()=>`<div class="card"><b>Cuentas abiertas</b>${S.tabs.map(t=>`<div class="sp"><span><b>${esc(t.mesa)}</b><br><small class="mu">${sum(t.items.map(i=>i.qty))} artículos · ${hm(t.t)}</small></span><span class="row"><b class="q">${money(sum(t.items.map(i=>i.price*i.qty)))}</b><button class="q" onclick="openTab('${t.id}')">Abrir</button></span></div>`).join('')||'<p class="mu">No hay cuentas abiertas.</p>'}</div>`;
/* ---- caja ---- */
const credPays=(f,t=Infinity,a)=>S.credits.flatMap(k=>k.pays).filter(p=>p.t>=f&&p.t<t&&(!a||p.acct===a));
function repHTML(r){const f=r.t,to=r.closed||Infinity,ss=S.sales.filter(s=>s.cs===f),ee=S.exps.filter(e=>e.cs===f),pr={};ss.forEach(s=>s.items.forEach(i=>pr[i.name]=(pr[i.name]||0)+i.qty));
 const ce=sum(ss.filter(s=>s.acct==='cash').map(s=>s.paid)),bk=sum(ss.filter(s=>s.acct==='bank').map(s=>s.paid)),cc=sum(credPays(f,to,'cash').map(p=>p.amount)),gas=sum(ee.map(e=>e.amount)),esp=r.fondo+ce+cc-gas,L=(a,b,c)=>`<div class="sp"><span>${a}</span><b class="${c||''}">${b}</b></div>`;
 return{esp,html:`<div class="card rep"><b>Reporte de caja</b><br><span class="mu">${hm(f)}${r.closed?' → '+hm(r.closed):''}</span><hr>${L('Fondo inicial',money(r.fondo))}${L('Total vendido ('+ss.length+')',money(sum(ss.map(s=>s.total))))}${L('Cobrado en efectivo',money(ce))}${L('Cobrado tarjeta/transferencia',money(bk))}${L('Fiado generado',money(sum(ss.map(s=>s.credit))))}${L('Cobros de créditos (efectivo)',money(cc))}${L('Gastos de caja','−'+money(gas),'bad')}${L('Efectivo esperado',money(esp))}${r.closed?L('Efectivo contado',money(r.counted))+L('Diferencia',money(r.counted-esp),r.counted-esp<0?'bad':'ok'):''}<hr><b>Más vendidos</b>${Object.entries(pr).sort((a,b)=>b[1]-a[1]).map(([n,q])=>`<div class="sp"><span>${esc(n)}</span><span>${q}</span></div>`).join('')||'<p class="mu">Sin ventas</p>'}</div>`}}
const openCash=()=>{S.cash={open:true,fondo:+$('#fd').value||0,t:Date.now()};save();render()};
function addExp(){const d=$('#ed').value.trim(),a=+$('#ea').value;if(!d||!a)return;S.exps.push({id:uid(),t:Date.now(),cs:S.cash.t,desc:d,amount:a});save();render()}
const closeCash=()=>ask('Cerrar caja',[{l:'Efectivo contado en caja (RD$)',t:'number'}],v=>{S.hist.unshift({id:uid(),t:S.cash.t,fondo:S.cash.fondo,closed:Date.now(),counted:+v[0]||0});S.cash={open:false};rep=S.hist[0];tab='hist'});
function vCaja(){const c=S.cash;if(!c.open)return`<div class="card"><b>Caja cerrada</b><p class="mu">Indica el efectivo con el que inicias.</p><input id="fd" type="number" inputmode="decimal" placeholder="Fondo inicial RD$" style="margin-bottom:8px"><button onclick="openCash()">Abrir caja</button></div>`;
 return`${repHTML(c).html}<div class="card"><b>Registrar gasto</b><div class="row" style="margin:8px 0"><input id="ed" placeholder="Descripción (hielo, gas...)"><input id="ea" type="number" inputmode="decimal" placeholder="Monto"></div><button onclick="addExp()">Agregar gasto</button>${S.exps.filter(e=>e.cs===c.t).map(e=>`<div class="sp"><span>${esc(e.desc)}</span><span>−${money(e.amount)}</span></div>`).join('')}</div><button class="d" style="width:100%" onclick="closeCash()">Cerrar caja y generar reporte</button>`}
const vHist=()=>rep?`<button class="g np" onclick="rep=null;render()">← Volver</button><div style="margin-top:8px">${repHTML(rep).html}</div><button class="np" onclick="print()">Imprimir</button>`:`<div class="card"><b>Cierres anteriores</b>${S.hist.map(r=>`<div class="sp"><span>${hm(r.t)}<br><small class="mu">${S.sales.filter(s=>s.cs===r.t).length} ventas</small></span><span class="row"><b class="q">${money(sum(S.sales.filter(s=>s.cs===r.t).map(s=>s.total)))}</b><button class="g q" onclick="rep=S.hist.find(x=>x.id==='${r.id}');render()">Ver</button></span></div>`).join('')||'<p class="mu">Aún no hay cierres.</p>'}</div>`;
/* ---- créditos ---- */
const payCred=id=>{const k=S.credits.find(x=>x.id===id);ask('Cobrar a '+k.client,[{l:'Monto (debe '+money(k.total-k.paid)+')',t:'number',v:k.total-k.paid},{l:'Entra a',o:[['cash','Efectivo'],['bank','Banco']]}],v=>{const a=+v[0];if(!(a>0)||a>k.total-k.paid+.01)return'Monto inválido';k.pays.push({t:Date.now(),amount:a,acct:v[1]});k.paid+=a})};
function vCred(){const p=S.credits.filter(k=>k.total-k.paid>.009);return`<div class="card"><div class="sp"><span>Total por cobrar</span><span class="tot" style="color:var(--bad)">${money(sum(p.map(k=>k.total-k.paid)))}</span></div></div><div class="card">${p.map(k=>`<div class="sp"><span><b>${esc(k.client)}</b><br><small class="mu">${hm(k.t)} · fiado ${money(k.total)} · pagado ${money(k.paid)}</small></span><span class="row"><b class="q bad">${money(k.total-k.paid)}</b><button class="q" onclick="payCred('${k.id}')">Cobrar</button></span></div>`).join('')||'<p class="mu">No hay deudores.</p>'}</div>`}
/* ---- compras / inventario ---- */
const addBuy=()=>ask('Registrar compra',[{l:'Insumo / producto'},{l:'Cantidad (unidades)',t:'number'},{l:'Costo total RD$',t:'number'},{l:'Factura (opcional)'},{l:'Se paga con',o:[['cash','Efectivo'],['bank','Banco']]}],v=>{const n=v[0].trim(),u=+v[1],c=+v[2];if(!n||!(u>0)||!(c>0))return'Completa insumo, cantidad y costo.';S.buys.unshift({id:uid(),t:Date.now(),name:n,units:u,cost:c,inv:v[3].trim(),acct:v[4]})});
const vCompras=()=>`<div class="card"><div class="sp"><span>Total en compras</span><b>${money(sum(S.buys.map(b=>b.cost)))}</b></div><br><button onclick="addBuy()">+ Registrar compra</button></div><div class="card">${S.buys.map(b=>`<div class="sp"><span><b>${esc(b.name)}</b> · ${b.units} uds<br><small class="mu">${hm(b.t)} · ${money(b.cost/b.units)} c/u${b.inv?' · Fact. '+esc(b.inv):''} · ${b.acct==='bank'?'banco':'efectivo'}</small></span><span class="row"><b class="q">${money(b.cost)}</b><button class="g q" onclick="S.buys=S.buys.filter(x=>x.id!=='${b.id}');save();render()">✕</button></span></div>`).join('')||'<p class="mu">Aún no hay compras.</p>'}</div>`;
function vInv(){const m={};S.buys.forEach(b=>{const o=m[b.name]=m[b.name]||{u:0,c:0};o.u+=b.units;o.c+=b.cost});
 return`<div class="card"><b>Inventario de insumos</b><p class="mu">Existencia = comprado − usado.</p>${Object.entries(m).map(([n,o])=>{const st=o.u-(S.use[n]||0);return`<div class="sp"><span><b>${esc(n)}</b><br><small class="mu">Comprado ${o.u} · usado ${S.use[n]||0} · ${money(o.c/o.u)} c/u</small></span><span class="row"><b class="q ${st<=0?'bad':''}">${st}</b><button class="g q" onclick="useIns(this.dataset.n)" data-n="${esc(n)}">Usar</button></span></div>`}).join('')||'<p class="mu">Registra compras para ver tu inventario.</p>'}</div>`}
const useIns=n=>ask('Usar '+n,[{l:'Cantidad usada / dañada',t:'number'}],v=>{const a=+v[0];if(!(a>0))return'Cantidad inválida';S.use[n]=(S.use[n]||0)+a});
/* ---- números ---- */
function agg(f,t){const o={ven:0,inc:0,ret:0},i=x=>x>=f&&x<t;S.sales.filter(s=>i(s.t)).forEach(s=>{o.ven+=s.total;o.inc+=s.paid});o.inc+=sum(credPays(f,t).map(p=>p.amount));
 o.gas=sum(S.exps.filter(e=>i(e.t)).map(e=>e.amount))+sum(S.movs.filter(m=>m.type==='gasto'&&i(m.t)).map(m=>m.amount));o.comp=sum(S.buys.filter(b=>i(b.t)).map(b=>b.cost));
 o.ret=sum(S.movs.filter(m=>m.type==='retiro'&&i(m.t)).map(m=>m.amount));o.net=o.inc-o.gas-o.comp;o.av=o.net-o.ret;return o}
const L=(a,b,c)=>`<div class="sp"><span>${a}</span><b class="${c||''}">${b}</b></div>`,cl=n=>n<0?'bad':'ok';
function vResumen(){const f=d0()-(per-1)*864e5,a=agg(f,Infinity),ss=S.sales.filter(s=>s.t>=f),pp={},dd={};ss.forEach(s=>{s.items.forEach(i=>{const o=pp[i.name]=pp[i.name]||{q:0,v:0};o.q+=i.qty;o.v+=i.qty*i.price});const k=new Date(s.t).toLocaleDateString('es-DO');dd[k]=(dd[k]||0)+s.total});
 return`<div class="row" style="margin-bottom:10px">${[[1,'Hoy'],[7,'7 días'],[30,'30 días']].map(p=>`<button class="${p[0]===per?'':'g'}" onclick="per=${p[0]};render()">${p[1]}</button>`).join('')}</div><div class="card">${L('Vendido',money(a.ven))}${L('Ingresos cobrados',money(a.inc),'ok')}${L('− Compras',money(a.comp),'bad')}${L('− Gastos',money(a.gas),'bad')}<div class="sp"><b>Resultado</b><span class="tot ${cl(a.net)}">${money(a.net)}</span></div>${L('Por cobrar (fiados)',money(sum(S.credits.map(k=>k.total-k.paid))),'bad')}${L('Ventas Delivery',money(sum(ss.filter(s=>s.tipo==='Delivery').map(s=>s.total))))}</div><div class="card"><b>Platos más vendidos</b>${Object.entries(pp).sort((x,y)=>y[1].q-x[1].q).slice(0,10).map(([n,o])=>L(esc(n)+' × '+o.q,money(o.v))).join('')||'<p class="mu">Sin ventas</p>'}</div><div class="card"><b>Por día</b>${Object.entries(dd).map(([k,v])=>L(k,money(v))).join('')||'<p class="mu">Sin ventas</p>'}</div>`}
function vGan(){const n=new Date(),f=new Date(n.getFullYear(),n.getMonth()+gm,1),t=new Date(n.getFullYear(),n.getMonth()+gm+1,1),a=agg(+f,+t),T=agg(0,Infinity);
 return`<div class="row" style="margin-bottom:10px;flex-wrap:nowrap"><button class="g q" onclick="gm--;render()">‹</button><b style="flex:1;text-align:center;text-transform:capitalize">${f.toLocaleDateString('es-DO',{month:'long',year:'numeric'})}</b><button class="g q" onclick="gm++;render()">›</button></div><div class="card"><b>Resumen del mes</b>${L('Ingresos cobrados',money(a.inc),'ok')}${L('− Compras de insumos',money(a.comp),'bad')}${L('− Gastos',money(a.gas),'bad')}<div class="sp"><b>Ganancia neta</b><span class="tot ${cl(a.net)}">${money(a.net)}</span></div>${L('− Retiros del mes',money(a.ret),'bad')}${L('Disponible del mes',money(a.av),cl(a.av))}</div><div class="card"><b>Disponible para retirar (acumulado)</b><div class="sp"><span class="mu">Ganancia neta − retiros</span><span class="tot ${cl(T.av)}">${money(T.av)}</span></div><button onclick="addMov('retiro')">Retirar dinero</button></div>`}
function fondo(){const c=S.cfg,A={cash:c.cash,bank:c.bank},ad=(a,v)=>A[a]+=v;let cap=c.cash+c.bank,loan=0;
 S.sales.forEach(s=>ad(s.acct,s.paid));credPays(0).forEach(p=>ad(p.acct,p.amount));S.exps.forEach(e=>ad('cash',-e.amount));S.buys.forEach(b=>ad(b.acct,-b.cost));
 S.movs.forEach(m=>{const a=m.amount;if(m.type==='aporte'){ad(m.acct,a);cap+=a}else if(m.type==='prestamo'){ad(m.acct,a);loan+=a}else if(m.type==='devolucion'){ad(m.acct,-a);loan-=a}else if(m.type==='retiro'||m.type==='gasto')ad(m.acct,-a);else if(m.type==='transfer'){ad(m.acct,-a);ad(m.acct==='cash'?'bank':'cash',a)}});return{...A,cap,loan}}
const MN={aporte:'Aporte de capital',prestamo:'Préstamo personal',devolucion:'Devolución de préstamo',retiro:'Retiro personal',gasto:'Gasto del negocio',transfer:'Transferencia'};
const addMov=ty=>ask(MN[ty]||'Movimiento',[{l:'Monto RD$',t:'number'},{l:ty==='transfer'?'Sale de':'Cuenta',o:[['cash','Efectivo'],['bank','Banco']]},{l:'Nota'}],v=>{const a=+v[0];if(!(a>0))return'Monto inválido';S.movs.unshift({id:uid(),t:Date.now(),type:ty,amount:a,acct:v[1],desc:v[2]})});
const setupFondo=()=>ask('Fondo inicial del negocio',[{l:'Efectivo inicial RD$',t:'number'},{l:'Banco inicial RD$',t:'number'}],v=>{S.cfg={start:Date.now(),cash:+v[0]||0,bank:+v[1]||0}},'Una vez confirmado no se puede cambiar.');
function vFondo(){if(!S.cfg)return`<div class="card"><b>Fondo del negocio</b><p class="mu">Define con cuánto empieza el negocio. Una vez confirmado no se puede cambiar.</p><button onclick="setupFondo()">Configurar fondo</button></div>`;const d=fondo();
 return`<div class="card" style="text-align:center"><span class="mu">Saldo total del negocio</span><div class="tot" style="font-size:32px">${money(d.cash+d.bank)}</div></div><div class="card">${L('Efectivo',money(d.cash),cl(d.cash))}${L('Banco',money(d.bank),cl(d.bank))}${L('Capital aportado',money(d.cap))}${L('Préstamos pendientes',money(d.loan),d.loan>0?'bad':'')}${L('Por cobrar (fiados)',money(sum(S.credits.map(k=>k.total-k.paid))))}</div><div class="card"><b>Movimientos</b><div class="row" style="margin:8px 0">${Object.keys(MN).map(k=>`<button class="g" onclick="addMov('${k}')">${MN[k]}</button>`).join('')}</div>${S.movs.slice(0,40).map(m=>L(MN[m.type]+' · '+hm(m.t)+(m.desc?' · '+esc(m.desc):''),(['aporte','prestamo'].includes(m.type)?'+':m.type==='transfer'?'':'−')+money(m.amount))).join('')||'<p class="mu">Sin movimientos.</p>'}</div>`}
/* ---- usuarios ---- */
const canM=u=>me.role==='o'?u.role!=='o':me.role==='a'&&u.role==='s';
function addUser(){const n=$('#un').value.trim(),u=$('#uu').value.trim().toLowerCase(),p=$('#up').value,r=me.role==='o'?$('#ur').value:'s';if(!n||!u||p.length<4)return alertM('Completa nombre, usuario y contraseña (mínimo 4 caracteres).');if(S.users.some(x=>x.user===u))return alertM('Ese usuario ya existe.');S.users.push({id:uid(),name:n,user:u,pass:p,role:r});save();render()}
const editU=id=>{const u=S.users.find(x=>x.id===id);ask('Editar '+u.name,[{l:'Nombre',v:u.name},{l:'Nueva contraseña (vacío = no cambiar)',t:'password'}],v=>{if(v[0].trim())u.name=v[0].trim();if(v[1]){if(v[1].length<4)return'Mínimo 4 caracteres';u.pass=v[1]}})};
const myPass=()=>ask('Cambiar mi contraseña',[{l:'Nueva contraseña',t:'password'}],v=>{if(v[0].length<4)return'Mínimo 4 caracteres';api('/api/state',{upsert:{users:[{id:me.id,pass:v[0]}]}})});
const delU=id=>ask('Eliminar usuario',[],()=>{S.users=S.users.filter(x=>x.id!==id)},'¿Seguro que quieres eliminarlo?');
const blk=id=>{const u=S.users.find(x=>x.id===id);u.blocked=!u.blocked;save();render()};
const resetData=()=>ask('Borrar datos de prueba',[{l:'Escribe BORRAR para confirmar'}],v=>{if(v[0].trim().toUpperCase()!=='BORRAR')return'No se borró nada.';Object.assign(S,{cash:{open:false},tabs:[],hist:[],sales:[],exps:[],credits:[],buys:[],movs:[],use:{},cfg:null})});
const vUsers=()=>`<div class="card"><b>Nuevo usuario</b><div class="row" style="margin:8px 0"><input id="un" placeholder="Nombre"><input id="uu" placeholder="Usuario" autocapitalize="none"><input id="up" type="password" placeholder="Contraseña">${me.role==='o'?'<select id="ur"><option value="s">Vendedor</option><option value="a">Administrador</option></select>':''}</div><button onclick="addUser()">Crear</button> <button class="g" onclick="myPass()">Cambiar mi contraseña</button></div><div class="card">${S.users.filter(u=>me.role==='o'||u.role!=='o').map(u=>`<div class="sp"><span>${esc(u.name)} <small class="mu">@${esc(u.user)} · ${RN[u.role]}${u.blocked?' · <b class="bad">BLOQUEADO</b>':''}</small></span><span class="row">${canM(u)?`<button class="g q" onclick="blk('${u.id}')">${u.blocked?'Desbloquear':'Bloquear'}</button><button class="g q" onclick="editU('${u.id}')">Editar</button><button class="d q" onclick="delU('${u.id}')">✕</button>`:''}</span></div>`).join('')}</div>${me.role==='o'?'<button class="d" onclick="resetData()">Borrar datos de prueba</button>':''}`;
/* ---- menú ---- */
const setP=(id,f,v)=>{const p=S.prods.find(x=>x.id===id);p[f]=f==='price'?+v||0:v;save()};
function newProd(){const n=$('#pn').value.trim(),p=+$('#pp').value,c=$('#pc').value.trim()||'Extras';if(!n||!p)return;S.prods.push({id:uid(),name:n,price:p,cat:c});save();render()}
const vMenu=()=>`<div class="card"><b>Agregar plato</b><div class="row" style="margin:8px 0"><input id="pn" placeholder="Nombre"><input id="pp" type="number" placeholder="Precio"><input id="pc" list="cl" placeholder="Categoría"><datalist id="cl">${cats().map(c=>`<option>${esc(c)}`).join('')}</datalist></div><button onclick="newProd()">Agregar</button></div><div class="card"><b>Menú y precios</b>${S.prods.map(p=>`<div class="sp"><input value="${esc(p.name)}" onchange="setP('${p.id}','name',this.value)"><input type="number" value="${p.price}" style="max-width:90px" onchange="setP('${p.id}','price',this.value)"><button class="d q" onclick="S.prods=S.prods.filter(x=>x.id!=='${p.id}');save();render()">✕</button></div>`).join('')}</div>`;
/* ---- shell ---- */
const TABS=[['venta','Venta','oas',vVenta],['cuentas','Cuentas','oas',vCuentas],['caja','Caja','oas',vCaja],['cred','Créditos','oas',vCred],['compras','Compras','oa',vCompras],['inv','Inventario','oa',vInv],['resumen','Resumen','oa',vResumen],['gan','Ganancias','oa',vGan],['fondo','Fondo','oa',vFondo],['hist','Reportes','oa',vHist],['menu','Menú','oa',vMenu],['users','Usuarios','oa',vUsers]];
function render(){const a=$('#app');
  if(!me){a.innerHTML=`<div class="login"><div><h1>El sabor de Yeli</h1><p class="mu" style="text-align:center;margin:0 0 10px">Control de caja</p><input id="lu" placeholder="Usuario" autocapitalize="none" style="margin-bottom:8px"><input id="lp" type="password" placeholder="Contraseña" onkeydown="if(event.key==='Enter')login()"><p style="color:#c0392b;margin:6px 0;font-weight:600">${err}</p><button style="width:100%" onclick="login()">Entrar</button></div></div>${dlgHTML()}`;return}
 const T=TABS.filter(t=>t[2].includes(me.role));if(!T.find(t=>t[0]===tab))tab='venta';
 const v=rcpt?`<b class="np" style="color:var(--ok)">✓ Venta registrada</b>${receipt(rcpt)}<div class="row np"><button class="g" onclick="print()">Imprimir</button><button onclick="rcpt=null;render()">Nueva venta</button></div>`:T.find(t=>t[0]===tab)[3]();
 a.innerHTML=`<header class="np"><b>El sabor de Yeli</b><span class="mu">${esc(me.name)} · ${S.cash.open?'Caja abierta':'Caja cerrada'}</span><button class="g" onclick="logout()">Salir</button></header><nav class="np">${T.map(t=>`<button class="${tab===t[0]?'':'g'}" onclick="go('${t[0]}')">${t[1]}${t[0]==='cuentas'&&S.tabs.length?' ('+S.tabs.length+')':''}</button>`).join('')}</nav><main>${v}</main>${dlgHTML()}`}
setInterval(()=>pull(),5000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
TK?pull(true).then(()=>{if(!me)render()}):render();
</script></body></html>
